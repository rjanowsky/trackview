# Build metadata + test-runner config for trackview.
#
# This is the single source of truth for how the package is built, what it
# depends on, and the `trackview` console entry point (PEP 518/621).  The legacy
# `requirements.txt` keeps the same runtime deps as a plain `pip install -r`
# convenience for the local `.venv`, and the two stay in sync.  See the "Setup"
# and "Testing" sections of README.md and the Phase 6 notes in PLAN.md / TODO.lst.
[build-system]
# setuptools>=77 is the floor for PEP 639 license expressions: `license = "Apache-2.0"`
# below is an SPDX expression, not the legacy {text=,file=} table, and older
# setuptools rejects a bare string.  This is a build-only dependency, so an
# isolated build (pip / python -m build / CI) fetches it automatically -- nothing
# extra lands in the runtime .venv.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "trackview"
# The version is dynamic: it is read from `trackview.config.__version__` (see the
# `[tool.setuptools.dynamic]` block below) rather than hard-coded here, so there
# is one source of truth -- the build-stamped version and `trackview --version`
# (both fed by that constant) can never drift from each other.
dynamic = ["version"]
# License is an SPDX expression (PEP 639), matched by the LICENSE file at the repo
# root; setuptools auto-discovers LICENSE* for the sdist.
license = "Apache-2.0"
authors = [{name = "rjanowsky"}]
description = "Render every GPX track in a folder onto a static map (PNG/PDF), with a ride-log, climb ranking, a training trend, an activity calendar and a self-contained HTML/Leaflet map."
readme = "README.md"
requires-python = ">=3.10"
# Core runtime: the trackview/ package's imports.  The versions mirror
# requirements.txt (kept in sync).
dependencies = [
    "contextily>=1.7",    # raster basemap fetch (the map + gallery)
    "gpxpy>=1.6",        # GPX parse (load_tracks)
    "matplotlib>=3.8",   # the figures (map, profile card, trend, calendar)
    "numpy>=1.24",       # per-segment grade / telemetry math
]

# fitparse is used only by the fit_to_gpx.py Garmin .fit converter (a top-level
# script, not the trackview/ package): the core runtime never imports it, so it
# is an optional extra rather than a hard dependency.
[project.optional-dependencies]
fit = ["fitparse>=1.2"]
test = ["pytest"]
# A linter for CI: ruff's pyflakes pass (unused imports / undefined names /
# unused locals + syntax errors) is the safe, style-agnostic gate -- the codebase
# has a deliberate loose comment-indent style, so we do NOT enable the pycodestyle
# (E/W) formatting rules, only F (correctness) + E9 (syntax).
lint = ["ruff>=0.11"]

# `pip install .` (or `pip install -e .`) drops a `trackview` command onto the
# PATH that runs the CLI, the installed counterpart to `python trackview.py`
# (the root launcher is a thin shim that re-enters this same main).
[project.scripts]
trackview = "trackview.cli:main"
fit-to-gpx = "fit_to_gpx:main"
wahoo-to-gpx = "wahoo_to_gpx:main"

# Ship the trackview/ package *and* its root-level scripts + standalone helpers
# so they reach the sdist.  A top-level script has the same basename as the
# module its [project.scripts] entry point runs (`fit_to_gpx.py` -> the
# `fit_to_gpx` module behind `fit-to-gpx`), so it ships only via an explicit
# `py-modules` entry, never by flat-layout auto-discovery.
[tool.setuptools]
packages = ["trackview"]
py-modules = ["trackview", "fit_to_gpx", "wahoo_to_gpx"]
# The `tools/` helpers (the .fit reader + its standalone variant) are pure-stdlib
# -- no `import trackview` -- and are not importable modules at all, so nothing in
# the core build reaches them.  They are not declared here: `data-files` would
# install them under sys.prefix in a wheel *and* resolves its paths against the
# sdist tree, not the project root (so it breaks the wheel build).  Instead MANIFEST.in
# `grafts` the whole `tools/` directory into the sdist, so a source checkout of
# `python -m build --sdist` keeps them alongside the package with nothing missing;
# the wheel carries only the importable package + launcher (tools/ is an
# out-of-tree helper, not part of the installed distribution).

# The dynamic `version` ([project].dynamic above) is resolved from this constant
# at build time, so the wheel/sdist metadata version and `trackview --version`
# share one source.  setuptools imports just `trackview.config` to read it, and
# that module touches only the stdlib `pathlib` (its package `__init__.py`
# re-exports nothing), so the build needs none of the heavy runtime deps.
[tool.setuptools.dynamic]
version = {attr = "trackview.config.__version__"}

# ---- test runner -------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]

# Two markers let CI run just the pure suite fast and offline:
#     .venv/bin/pytest -m "not network and not slow"
#   network  - a path that fetches basemap tiles or the Leaflet CDN
#   slow     - a path that renders a matplotlib figure
markers = [
     "network: fetches basemap tiles or the Leaflet CDN (skipped in the fast suite)",
     "slow: renders a matplotlib figure (skipped in the fast pure suite)",
]

# ---- linter ------------------------------------------------------------------
# ruff is the CI linter (a separate "lint" job).  We gate on F (pyflakes: unused
# imports / undefined names / unused locals) + E9 (syntax errors) only -- the
# codebase uses a deliberate loose comment-indent style, so the pycodestyle (E/W)
# formatting rules are intentionally NOT selected.  CI runs a bare `ruff check`
# (default = all selected rules), so the selection lives here.
[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["F", "E9"]
